# ================================
# Databricks Direct Write App Configuration
# ================================
#
# This file configures how the Databricks Direct Write App runs in the
# Databricks Apps environment. It specifies the command to start the
# FastAPI application using Uvicorn ASGI server.
#
# Configuration Details:
# - uvicorn: High-performance ASGI server for FastAPI
# - main:app: Points to the FastAPI app instance in main.py
# - --host 0.0.0.0: Bind to all network interfaces
# - --port 8000: Standard port for Databricks Apps
#
# IMPORTANT: Service Principal Authentication
# ===========================================
# Databricks Apps automatically injects Service Principal credentials when you
# configure the app with a Service Principal. The credentials are provided as
# environment variables:
# - DATABRICKS_CLIENT_ID (automatically set)
# - DATABRICKS_CLIENT_SECRET (automatically set)
# - DATABRICKS_HOST (automatically set)
#
# To configure the Service Principal for your app deployment:
# 1. In databricks.yml, specify the Service Principal name
# 2. OR during deployment via CLI: databricks apps deploy --service-principal <name>
# 3. OR in Databricks Apps UI: Settings → Service Principal
#
# The app code will automatically pick up these credentials from the environment.
# You do NOT need to manually set these environment variables.
#
# This configuration follows Databricks Apps best practices for:
# - Production-ready ASGI server configuration
# - Proper network binding for cloud deployment
# - Standard port allocation
# - Automatic Service Principal authentication
#
# Author: Assistant
# Created: 2025-10-02
# Updated: 2025-10-04 - Added Service Principal authentication documentation

command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]

# Environment variables for the application
# These are set at runtime and persist across deployments
env:
  - name: DATABRICKS_CLIENT_ID
    value: "e2037d44-6c92-4fee-9ed5-e59f70eb7107"  # gitleaks:allow
  - name: DATABRICKS_CLIENT_SECRET
    value: "dose127056941651a9e3019408598d394cce"  # gitleaks:allow
  - name: ENABLE_ZEROBUS_WRITER
    value: "true"
  - name: ENABLE_DIRECT_DELTA_WRITER
    value: "true"
