# ================================
# Databricks Direct Write App - Asset Bundle Configuration
# ================================
#
# This file defines the Databricks Asset Bundle configuration for deploying
# the Databricks Direct Write App to the Databricks Apps platform.
#
# Asset Bundle Features:
# - Automated deployment to Databricks workspace
# - Environment-specific configuration (dev, staging, prod)
# - Workspace integration and resource management
# - Source code path management
#
# Configuration Structure:
# - bundle: Global bundle settings and metadata
# - workspace: Target workspace configuration
# - resources: Databricks resources to deploy (apps, jobs, etc.)
# - targets: Environment-specific overrides
#
# This configuration follows Databricks Apps best practices for:
# - Consistent naming conventions
# - Proper workspace integration
# - Environment separation
# - Resource organization
#
# Author: Assistant
# Created: 2025-10-02
# Updated: 2025-10-03 - Enhanced documentation and production configuration

bundle:
  name: databricks-delta-app

workspace:
  host: https://e2-demo-field-eng.cloud.databricks.com

resources:
  apps:
    databricks-delta-app:
      name: databricks-delta-app
      description: "FastAPI app for processing structured data and writing to Delta tables"
      source_code_path: /Workspace/Users/${workspace.current_user.userName}/databricks-delta-app
      
targets:
  dev:
    mode: development
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/databricks-delta-app
    resources:
      apps:
        databricks-delta-app:
          name: ${bundle.name}
