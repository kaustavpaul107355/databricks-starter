# Databricks Delta App - Bundle Configuration
# Configuration for deploying the FastAPI app to Databricks Apps platform
# Follows Databricks Apps naming and deployment best practices

bundle:
  name: databricks-delta-app

workspace:
  host: https://e2-dogfood.staging.cloud.databricks.com

resources:
  apps:
    databricks-delta-app:
      name: databricks-delta-app
      description: "FastAPI app for processing structured data and writing to Delta tables"
      source_code_path: /Workspace/Users/${workspace.current_user.userName}/databricks-delta-app
      
targets:
  dev:
    mode: development
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/databricks-delta-app
    resources:
      apps:
        databricks-delta-app:
          name: ${bundle.name}
