# Databricks App Configuration for Zerobus Delta App
# Enterprise configuration following Databricks Apps standards

bundle:
  name: zerobus-delta-app

workspace:
  host: https://e2-demo-field-eng.cloud.databricks.com

resources:
  apps:
    zerobus-delta-app:
      name: zerobus-delta-app
      description: "Enterprise FastAPI server for processing payloads and writing to Delta tables via Zerobus"
      
targets:
  dev:
    mode: development
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/zerobus-delta-app
    resources:
      apps:
        zerobus-delta-app:
          name: ${bundle.name}-dev
          
  prod:
    mode: production
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/zerobus-delta-app-prod
    resources:
      apps:
        zerobus-delta-app:
          name: ${bundle.name}-prod
